name: gate
on: [push, pull_request]
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: one source of truth (kernel.mjs = live page = skill script)
        run: node build-skill.mjs --check
      - name: tests (the kernel, and the shipped skill script run alone as an agent store runs it)
        run: node --test kernel.test.mjs skill.test.mjs
      - name: the committed mutation receipt is for this kernel and these tests
        run: node gate.mjs --verify
      - name: Agensi ZIP (package rules checked, SHA-256 printed)
        run: node make-zip.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: agensi-zip
          path: dist/*.zip
      - name: mutation gate — kernel.mjs must be CLEAN
        run: |
          node tools/witness.mjs mutate kernel.mjs --timeout 30000 --cap 600 --baseline witness.baseline.json --test node --test kernel.test.mjs | tee gate.out || true
          node -e "const b=require('fs').readFileSync('gate.out','utf8');const j=JSON.parse(b.slice(b.indexOf('{'),b.lastIndexOf('}')+1));if(j.clean!==true){console.error('GATE NOT CLEAN');process.exit(1)}console.log('CLEAN '+j.killed+'/'+j.total)"
      - name: page fixpoint — the live logic IS the gated kernel
        run: |
          node make-page.mjs
          git diff --exit-code index.html
